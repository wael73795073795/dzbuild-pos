name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      arch:
        description: Windows architectures to build
        type: choice
        options: [x64, both, x86]
        default: x64
      prerelease:
        description: Mark the draft release as a pre-release
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  prepare:
    name: Version, tag and arches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      release_title: ${{ steps.plan.outputs.release_title }}
      arches: ${{ steps.plan.outputs.arches }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      skip: ${{ steps.existing.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: existing
        name: Is this tag already released?
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          count="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
          if [ "$count" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already has a release with $count files: nothing to build." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v7
        if: steps.existing.outputs.skip != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: plan
        if: steps.existing.outputs.skip != 'true'
        name: Plan the release
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          ARCH_INPUT: ${{ inputs.arch }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          check="$(node scripts/release/version.mjs --check)"
          case "$check" in
            "version "*) version="${check#version }" ;;
            *) echo "::error::$check"; exit 1 ;;
          esac
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::the tag $REF_NAME does not match the version $version"
            exit 1
          fi
          case "${ARCH_INPUT:-x64}" in
            both) arches='["x64","x86"]' ;;
            x64) arches='["x64"]' ;;
            x86) arches='["x86"]' ;;
            *) echo "::error::unknown arch $ARCH_INPUT"; exit 1 ;;
          esac
          prerelease=false
          if [[ "$version" == *-* ]] || [ "$PRERELEASE_INPUT" = "true" ]; then prerelease=true; fi
          test -f "src/release-notes/$version.json" || { echo "::error::src/release-notes/$version.json is missing"; exit 1; }
          node scripts/release/notes-for-tag.mjs "v$version" > /dev/null

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            clean_branch="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//')"
            [ -n "$clean_branch" ] || clean_branch="build"
            release_tag="v${version}-r${RUN_NUMBER}-${clean_branch}"
            release_title="DZBuild POS ${version} (Run #${RUN_NUMBER} - ${REF_NAME})"
          else
            release_tag="v$version"
            release_title="DZBuild POS $version"
          fi

          {
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "release_title=$release_title"
            echo "arches=$arches"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "DZBuild POS $version ($release_tag): arches $arches, prerelease $prerelease" >> "$GITHUB_STEP_SUMMARY"

  installers:
    name: Installers (${{ matrix.arch }})
    needs: [prepare]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.arches) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: 32-bit Rust target
        if: matrix.arch == 'x86'
        run: rustup target add i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: installers-${{ matrix.arch }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the ${{ matrix.arch }} setups
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DZPOS_SIGN_PROVIDER: ${{ secrets.DZPOS_SIGN_PROVIDER }}
          DZPOS_SIGN_THUMBPRINT: ${{ secrets.DZPOS_SIGN_THUMBPRINT }}
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ secrets.SM_CLIENT_CERT_FILE }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_KEYPAIR_ALIAS: ${{ secrets.SM_KEYPAIR_ALIAS }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          CODESIGNTOOL_DIR: ${{ secrets.CODESIGNTOOL_DIR }}
        run: pnpm release:build --arch $env:ARCH
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.arch }}
          path: dist-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Draft GitHub release
    needs: [prepare, installers]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: ${{ runner.temp }}/installers
      - name: One release folder, one SHA256SUMS.txt
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "installers"
          $versionDirs = @(Get-ChildItem -Path $root -Directory -Recurse -Filter $env:VERSION | Sort-Object FullName)
          if ($versionDirs.Count -gt 0) {
            $sources = @()
            foreach ($dir in $versionDirs) {
              $stage = Join-Path $env:RUNNER_TEMP ("stage-" + [guid]::NewGuid().ToString("N"))
              New-Item -ItemType Directory -Path (Join-Path $stage $env:VERSION) -Force | Out-Null
              Copy-Item -Path (Join-Path $dir.FullName "*") -Destination (Join-Path $stage $env:VERSION) -Recurse -Force
              $sources += $stage
            }
            node scripts/release/collect.mjs $env:VERSION @sources
          } else {
            $sources = @(Get-ChildItem $root -Directory | Sort-Object Name | ForEach-Object { $_.FullName })
            node scripts/release/collect.mjs $env:VERSION @sources
          }
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $outDir = "dist-release/$env:VERSION"
            Get-ChildItem -Path $outDir -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
              $newName = "$($_.BaseName)-r$($env:RUN_NUMBER)$($_.Extension)"
              Rename-Item -LiteralPath $_.FullName -NewName $newName
            }
          }
      - name: Update manifests (pnpm release:manifest)
        shell: pwsh
        env:
          DZPOS_SIGN_PROVIDER: ${{ secrets.DZPOS_SIGN_PROVIDER }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            Write-Output "::notice::Skipping updater manifest generation for workflow_dispatch run."
            exit 0
          }
          $sig = "dist-release/$env:VERSION/DZBuildPOS-$env:VERSION-setup.exe.sig"
          if (-not (Test-Path -LiteralPath $sig)) {
            Write-Output "::notice::No updater signature (TAURI_SIGNING_PRIVATE_KEY not set): no update manifest for $env:VERSION."
            exit 0
          }
          $extra = @()
          if (-not $env:DZPOS_SIGN_PROVIDER) {
            if ($env:VERSION -notmatch "-") {
              Write-Output "::notice::Stable $env:VERSION without Authenticode signing: no update manifest (only a beta may be published unsigned)."
              exit 0
            }
            $extra += "--allow-unsigned"
          }
          pnpm release:manifest @extra
      - name: Release notes
        shell: pwsh
        run: node scripts/release/notes-for-tag.mjs "v$env:VERSION" --out (Join-Path $env:RUNNER_TEMP "release-notes.md")
      - name: Create or update the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $files = @(Get-ChildItem "dist-release/$env:VERSION" -File | ForEach-Object { $_.FullName })
          if (Test-Path "dist-release/$env:VERSION/updates") {
            foreach ($channel in Get-ChildItem "dist-release/$env:VERSION/updates" -Directory) {
              $manifest = Join-Path $env:RUNNER_TEMP "latest-$($channel.Name).json"
              Copy-Item -LiteralPath (Join-Path $channel.FullName "latest.json") -Destination $manifest
              $files += $manifest
            }
          }
          $pre = $env:PRERELEASE -eq "true"
          $draft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne "true") { throw "$tag is already published; bump the version for a new release" }
            gh release upload $tag @files --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft --title $env:RELEASE_TITLE --notes-file $notes --prerelease=$($pre.ToString().ToLower())
          } else {
            $flags = @()
            if ($pre) { $flags += "--prerelease" }
            gh release create $tag @files --draft --target $env:GITHUB_SHA --title $env:RELEASE_TITLE --notes-file $notes --repo $env:GITHUB_REPOSITORY @flags
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "Release $tag ready: $($files.Count) files" >> $env:GITHUB_STEP_SUMMARY
